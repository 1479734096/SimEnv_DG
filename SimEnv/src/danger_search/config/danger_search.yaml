# danger_search 默认参数。
# 坐标输出遵循 docs/evaluation.md：使用 Gazebo world/odom 数值坐标。

topics:
  cmd_vel: /cmd_vel
  odom: /Odometry_gazebo
  cloud: /livox/Pointcloud2
  rgb: /real_sense/rgb/image_raw
  depth: /real_sense/depth/image_raw
  camera_info: /real_sense/rgb/camera_info
  status: /danger_search/status
  map: /nav/map_debug
  path_raw: /danger_search/path_raw
  path_followed: /danger_search/path_followed
  local_target: /danger_search/local_target

mission:
  startup_delay: 2.0
  max_runtime: 590.0
  max_floor: 1
  floor_timeout: 180.0
  # 非最后一层仍以 floor_timeout 保护后续楼层；最后一层由全局返航预算收口。
  # 设为 false 可立即恢复“所有楼层到时即结束”的旧语义。
  last_floor_uses_global_budget: true
  min_floor_explore_time: 20.0
  min_floor_travel_distance: 6.0
  min_known_area: 45.0
  no_reachable_frontier_confirmations: 2
  # 走廊主方向最小已知范围，0 表示关闭；方向由 probe_yaw 判断。
  min_corridor_progress_distance: 0.0
  # 过门后至少推进到该距离、且门后侧已知面积足够前，持续优先门后侧目标。
  post_door_min_distance: 2.0
  post_door_min_known_area: 8.0
  home_tolerance: 0.7
  explore_coverage_ratio: 0.82
  no_frontier_scan_duration: 4.0
  probe_distance: 1.2
  probe_yaw: 1.5708
  # 过门后先深入到门后，避免刚过门就把 frontier 选择权交回门口。
  door_pass_offset: 0.8
  door_commit_distance: 1.8
  # 开门后沿门洞 yaw 清理动态障碍的条带深度，宽度来自 layout_metadata.json 的门 width。
  door_clear_radius: 0.9
  # 仅在过门后的短时间、且机器人仍在门口附近时抑制回头目标。
  door_transition_duration: 3.0
  door_transition_hold_distance: 2.5
  # 即使推进/已知面积条件未满足，临时门禁也必须在该时限后退出。
  post_door_context_max_duration: 12.0
  # 永久入口禁回区按门宽缩放；远处只连续降分，不使用无限半平面硬过滤。
  permanent_forbidden_radius_scale: 1.5
  permanent_forbidden_penalty: 3.0
  permanent_forbidden_decay_scale: 3.0
  status_publish_period: 1.0
  # Gazebo 已证伪跨骑卡死后的倒车恢复；默认关闭，仅保留显式诊断入口。
  exit_cabin_backoff_enabled: false
  # 方案 C：全局时间预算参数
  # 返航安全缓冲（秒）：在 estimated_return_time 之外再预留的时间
  return_safety_buffer: 30.0
  # 返航保守速度估计（m/s），用于估算返航时间
  return_speed_estimate: 0.35
  # 换层基础时间估计（秒），包含电梯等待和移动
  floor_change_time_estimate: 40.0
  # 楼层结束软边界比例：floor_timeout * ratio 后可结合收益考虑结束
  floor_finish_time_ratio: 0.75
  # 探索收益评估窗口（秒）
  exploration_progress_window: 15.0
  # 窗口内至少新增多少已知/可通行栅格才算有进展
  min_exploration_progress_cells: 30
  # 剩余 frontier 少于该值时认为当前层接近穷尽
  min_remaining_frontiers: 2
  # 换层前要求剩余总时间的比例（相对于 max_runtime）
  min_floor_change_remaining_ratio: 0.25

map:
  resolution: 0.10
  width: 28.0
  length: 48.0
  origin_x: -14.0
  origin_y: -6.0
  floor_height: 2.6
  obstacle_min_z: 0.15
  obstacle_max_z: 1.40
  obstacle_inflation_radius: 0.35
  raycast_max_range: 12.0
  # 只有明确障碍命中可清到远端；地面/天花等非障碍回波只清近场。
  point_free_clear_max_range: 1.5
  visited_radius: 0.45
  # 可视扇区自由空间清空：默认偏保守，优先避免穿过已知障碍或凭空穿墙。
  free_clear_enabled: true
  free_clear_max_range: 8.0
  free_clear_angle_step: 0.1745
  free_clear_obstacle_margin: 0.25
  free_clear_min_points_per_bin: 2
  cloud_stride: 3
  cloud_max_points: 18000

frontier:
  min_cluster_size: 4
  blacklist_ttl: 60.0
  fail_limit: 3
  # STUCK 后临时排除同一前沿簇附近目标，避免质心轻微漂移后立刻重试同一路线。
  stuck_blacklist_radius: 1.20
  no_progress_timeout: 8.0
  information_gain_weight: 1.0
  path_cost_weight: 3.0
  yaw_cost_weight: 0.3
  revisit_penalty_weight: 2.0
  # frontier 目标优先落在更安全的 free cell，不贴障碍和 unknown 边缘。
  frontier_obstacle_clearance: 0.25
  frontier_unknown_standoff: 0.20
  frontier_min_information_gain: 1.0
  # 过门后的临时回头抑制：只在门附近有限半径内生效，远处仅小幅降分。
  door_front_half_plane_penalty: 3.0
  door_front_half_plane_radius: 1.5
  door_preferred_direction_bonus: 1.5
  # 短期选择惯性：当前区域仍可达时，新目标分数需要至少高出该 margin 才切换。
  switch_score_margin: 5.0
  current_region_radius: 2.0
  # 先以可解释的乐观分数缩小精确 A* 集合，避免 Timer 回调长时间阻塞。
  max_planning_candidates: 8
  max_goal_candidates_per_frontier: 2
  max_fallback_planning_candidates: 8

controller:
  max_linear: 0.60
  # 0 保持既有全局上限；正数仅限制首次 EXIT_CABIN 通过尝试。
  exit_first_max_linear: 0.0
  max_lateral: 0.25
  max_angular: 1.2
  min_linear_fraction: 0.35
  goal_tolerance: 0.35
  waypoint_tolerance: 0.25
  corner_tolerance: 0.15
  pure_pursuit_lookahead: 0.45
  reverse_speed: -0.15
  recover_duration: 0.5
  recover_turn_duration: 1.0
  recover_angular_speed: 0.55
  # 独立 Timer 重发最近的安全命令，周期必须小于 junior_ctrl 的 0.5 秒超时。
  command_keepalive_period: 0.1
  # A1 机身前缘需要留出停车余量；近于 stop 时只转向，slow 范围内连续减速。
  obstacle_stop_distance: 0.50
  obstacle_slow_distance: 1.00
  progress_distance: 0.25

# 局部地面支撑安全门。默认关闭；开启后只消费未来足迹走廊，不改占据地图。
ground_support:
  production_gate_enabled: false
  # UNKNOWN 临时观察停车可独立关闭；显式低层回波 DROP 仍会锁存停车。
  # 默认保留完整语义，门/电梯闭环回归可用覆盖配置验证 explicit-DROP-only 模式。
  unknown_support_hold_enabled: true
  # 明确 DROP 停稳后仅让当前路径失效，并用现有 BLACK 栅格有界重规划。
  negative_obstacle_replan_enabled: true
  maximum_negative_obstacle_replans: 3
  # 按实测速度上界查保守停车距离，不插值、不向表外外推；有效速度上限取最后一档。
  # 扩速时新增实测档位并同步复验前视距离，无需修改门控代码或全局控制器速度。
  stop_distance_table:
    - [0.60, 0.09337727739487302]
    - [0.651, 0.10195826367975175]
    - [0.80, 0.13]
  # 正支撑只看左右足迹带；完整物理宽度仍专用于明确 DROP 检测。
  foot_band_center_offset: 0.14
  foot_band_half_width: 0.10
  minimum_foot_band_coverage: 0.60
  # 仅允许被下游正支撑封闭的短内部缺口，末端 UNKNOWN 不桥接。
  maximum_longitudinal_unknown_gap: 0.10
  minimum_longitudinal_support_ratio: 0.75
  sweep_half_width: 0.435393
  minimum_lookahead: 0.50
  # 该前视上限只对当前已验证速度负责；扩速前必须重新验证完整安全包络。
  maximum_lookahead: 0.80
  footprint_front_reach: 0.30
  support_band: 0.08
  minimum_drop: 0.30
  minimum_cell_hits: 2
  required_consecutive_frames: 2
  minimum_alert_cells: 3
  minimum_frame_points: 50
  # 仅稀疏积累局部邻域内的明确楼面回波；负证据和安全消费仍只看未来扫掠区。
  local_support_evidence_radius: 3.0
  # 独立消费最新 cloud，避免 10Hz 任务 tick 固定晚一帧；不改变任务/控制节拍。
  assessment_period: 0.02
  # 由停车余量反推的 DROP 证据硬上限；0.25s 陈旧证据明确无效。
  drop_evidence_max_age: 0.05
  decision_period: 0.10
  rl_receive_delay: 0.009
  required_margin: 0.02
  release_hysteresis: 0.10
  release_supported_frames: 2
  observation_hold_timeout: 2.0
  safety_stop_timeout: 3.0
  stop_linear_threshold: 0.02
  stop_angular_threshold: 0.05
  stop_confirmation_samples: 3
  # UNKNOWN 超时仅清当前 follower 路径，同一父任务 phase 最多重规划两次。
  maximum_same_phase_replans: 2
  base_frame: base
  sensor_frame: laser_livox

detection:
  min_area: 35
  min_circularity: 0.55
  min_aspect: 0.65
  max_aspect: 1.55
  min_radius: 0.10
  max_radius: 0.22
  max_rmse: 0.035
  ransac_iterations: 80
  ransac_sample_size: 4
  max_depth: 8.0
  min_depth: 0.35
  # RGB-D 反投影使用 OpenCV 光学坐标：x 右、y 下、z 前。
  # Gazebo 插件 frameName 通常写 robot link 名，因此默认转换到 ROS link 坐标后再走 TF。
  depth_frame_is_optical: true

local_semantic:
  max_door_distance: 3.0
  door_fov_half_angle: 0.85
  door_evidence_radius: 0.75
  min_door_evidence_points: 6
  min_door_evidence_height: 0.15
  max_door_evidence_height: 1.80
  # 仅用于调试：关闭时必须有局部传感器证据，不能只靠 metadata 近距判断开门。
  use_truth_proximity_detector: false

tracker:
  association_radius: 0.45
  confirmation_window: 10.0
  min_hits: 4
  max_position_std: 0.25
  min_confidence: 0.75
  max_average_rmse: 0.04
  nms_radius: 0.9
  stale_after: 30.0

floor:
  elevator_id: elevator_main
  elevator_lobby_xy: [1.0, 2.6]
  elevator_inside_xy: [2.6, 2.6]
  service_timeout: 5.0
