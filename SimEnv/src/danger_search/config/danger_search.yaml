# danger_search 正式默认参数。
# 加载链：danger_search.launch -> MissionManager._load_params -> 各组件构造函数。
# 坐标由参赛方 /scan 定位节点锚定；正式模式只读取公开 team_scene_info.json。
# 各组件不会自行从参数服务器读取隐藏参数，因此本文件是生产行为的统一配置面。

runtime:
  profile: formal

topics:
  # 外部话题必须同时通过静态白名单与本场景 allowed_interfaces；
  # /danger_search、/nav 下的话题均为参赛方内部派生数据或诊断输出。
  cmd_vel: /cmd_vel
  localization_odom: /danger_search/localization/odom
  cloud: /danger_search/localization/cloud_registered
  rgb: /real_sense/rgb/image_raw
  depth: /real_sense/depth/image_raw
  camera_info: /real_sense/rgb/camera_info
  status: /danger_search/status
  map: /nav/map_debug
  path_raw: /danger_search/path_raw
  path_followed: /danger_search/path_followed
  local_target: /danger_search/local_target

localization:
  team_scene_info_path: generated_building/team_scene_info.json
  require_team_scene_info: true
  allow_relative_origin: false
  # formal 必须消费定位节点的持续姿态健康；仅 diagnostic smoke 可关闭。
  stance_health_required: true
  # 当前合规 RGB-D/Livox 后端只估计平面运动；z 是当前楼层局部高度。
  # MissionManager 仅用公开楼层 ID 将点云分层，不把该 z 冒充绝对楼层高度。
  vertical_reference: floor_local
  base_to_camera_xyz: [0.28, 0.0, 0.043]
  base_to_camera_rpy: [0.0, 0.0, 0.0]
  # Livox 名义 10 Hz；短暂陈旧先停车，持续 3 秒无新定位则显式失败。
  stale_minimum: 0.4
  unavailable_timeout: 3.0

mission:
  # 顶层状态机、单层完成判据、返航预算、过门上下文和任务输出策略。
  startup_delay: 2.0
  # /nav/goal 不属于比赛公开接口，仅诊断工具可显式开启。
  manual_goal_enabled: false
  # 正式总预算按公开 served_floors 数量选择；专项配置可用更短 max_runtime。
  max_runtime: 900.0
  runtime_by_floor: [[1, 300.0], [2, 620.0], [3, 840.0]]
  floor_timeout: 280.0
  # 非最后一层仍以 floor_timeout 保护后续楼层；最后一层由全局返航预算收口。
  # 设为 false 可立即恢复“所有楼层到时即结束”的旧语义。
  last_floor_uses_global_budget: true
  min_floor_explore_time: 60.0
  min_floor_travel_distance: 6.0
  min_known_area: 44.0
  no_reachable_frontier_confirmations: 2
  # 走廊主方向最小已知范围，0 表示关闭；方向由 probe_yaw 判断。
  min_corridor_progress_distance: 0.0
  # 主入口过门后先沿门轴推进到该距离，确保机身完全离开门框；普通门仍只用于前沿偏置。
  post_door_min_distance: 0.9
  post_door_min_known_area: 5.0
  home_tolerance: 1.0
  # 返航局部层已确认首段不可执行时，有限次否决同一路径；耗尽后显式失败，禁止活锁。
  return_home_max_stuck_retries: 4
  return_home_max_candidate_rejects: 3
  return_home_veto_lookahead: 0.8
  # 电梯长程接近必须有界；规划失败保留短暂地图更新窗口，耗尽后显式失败。
  elevator_navigation_timeout: 120.0
  elevator_planning_retry_limit: 3
  elevator_stuck_retry_limit: 4
  explore_coverage_ratio: 0.80
  no_frontier_scan_duration: 4.0
  # 贴墙时禁止无前沿扫描/普通卡滞恢复原地转向，避免腿部旋转包络扫墙导致倾倒。
  no_frontier_rotation_min_clearance: 0.40
  # 旋转净距不足时，只沿本层真实行驶轨迹后退一次，到较宽处再扫描一次。
  no_frontier_retreat_max_distance: 2.0
  no_frontier_retreat_clearance_margin: 0.10
  probe_distance: 1.0
  probe_yaw: 1.5708
  # 起点存在公开主入口时，先沿当前朝向上由传感器确认的 FREE 走廊深入。
  # 仅限制局部探测上限，不包含门坐标或场景特例。
  initial_entry_max_distance: 5.0
  initial_entry_corridor_half_width: 0.25
  initial_entry_opening_confirmations: 2
  initial_entry_opening_max_distance: 1.50
  initial_entry_geometry_tolerance: 0.3
  # 过门后先深入到门后，避免刚过门就把 frontier 选择权交回门口。
  door_pass_offset: 0.5
  # 服务开门后用近场点云重新对准门洞；跨门段限速，减少横向定位误差积累。
  door_pass_max_linear: 0.35
  # 越过门面后的轴向离门段需要克服门槛接触，但仍低于普通探索速度。
  main_entrance_clearance_max_linear: 0.4
  door_refresh_timeout: 3.0
  # 当前点云重测中心可吸收定位平移误差，但不得把相邻走廊开口覆盖成主入口。
  door_refresh_max_center_shift: 0.60
  # 净空按 A1 扫掠半宽双侧增加余量，不足时禁止尝试穿越。
  door_clearance_margin: 0.10
  # door_commit_distance: 1.8
  # 传感器发现门后才启用过门条带；单层合规基线不从布局文件读取门宽。
  door_clear_radius: 0.9
  # 仅在过门后的短时间、且机器人仍在门口附近时抑制回头目标。
  door_transition_duration: 1.5
  door_transition_hold_distance: 1.5
  # 即使推进/已知面积条件未满足，临时门禁也必须在该时限后退出。
  post_door_context_max_duration: 8.0
  # 永久入口禁回区按门宽缩放；远处只连续降分，不使用无限半平面硬过滤。
  permanent_forbidden_radius_scale: 1.5
  permanent_forbidden_penalty: 3.0
  permanent_forbidden_decay_scale: 1.5
  status_publish_period: 0.5
  # Gazebo 已证伪跨骑卡死后的倒车恢复；默认关闭，仅保留显式诊断入口。
  exit_cabin_backoff_enabled: false
  # 方案 C：全局时间预算参数
  # 返航安全缓冲（秒）：在 estimated_return_time 之外再预留的时间
  return_safety_buffer: 30.0
  # 返航保守速度估计（m/s），用于估算返航时间
  return_speed_estimate: 0.4
  # 换层基础时间估计（秒），包含电梯等待和移动
  floor_change_time_estimate: 30.0
  # 楼层结束软边界比例：floor_timeout * ratio 后可结合收益考虑结束
  floor_finish_time_ratio: 0.80
  # 探索收益评估窗口（秒）
  exploration_progress_window: 15.0
  # 窗口内至少新增多少已知/可通行栅格才算有进展
  min_exploration_progress_cells: 30
  # 剩余 frontier 少于该值时认为当前层接近穷尽
  min_remaining_frontiers: 2
  # 换层前要求剩余总时间的比例（相对于 max_runtime）
  min_floor_change_remaining_ratio: 0.25

map:
  # 每层独立 2.5D 栅格；NEGATIVE 只表达传感器确认的动态负障，不编码房间语义。
  resolution: 0.10
  width: 28.0
  length: 48.0
  origin_x: -14.0
  origin_y: -6.0
  floor_height: 2.6
  obstacle_min_z: 0.15
  obstacle_max_z: 1.40
  obstacle_inflation_radius: 0.25
  raycast_max_range: 15.0
  # 只有明确障碍命中可清到远端；地面/天花等非障碍回波只清近场。
  point_free_clear_max_range: 3
  visited_radius: 0.5
  # 可视扇区自由空间清空：默认偏保守，优先避免穿过已知障碍或凭空穿墙。
  free_clear_enabled: true
  free_clear_max_range: 15.0
  free_clear_angle_step: 0.1745
  free_clear_obstacle_margin: 0.25
  free_clear_min_points_per_bin: 2
  cloud_stride: 4
  cloud_max_points: 24000

frontier:
  # 前沿聚类、安全落点、A* 候选预算、收益评分、惯性和短期黑名单。
  min_cluster_size: 4
  blacklist_ttl: 40.0
  fail_limit: 3
  # STUCK 后临时排除同一前沿簇附近目标，避免质心轻微漂移后立刻重试同一路线。
  stuck_blacklist_radius: 1.0
  no_progress_timeout: 6.0
  information_gain_weight: 1.0
  path_cost_weight: 3.0
  yaw_cost_weight: 0.3
  revisit_penalty_weight: 2.0
  # frontier 目标优先落在更安全的 free cell，不贴障碍和 unknown 边缘。
  frontier_obstacle_clearance: 0.25
  frontier_unknown_standoff: 0.20
  frontier_min_information_gain: 1.0
  # 过门后的临时回头抑制：只在门附近有限半径内生效，远处仅小幅降分。
  door_front_half_plane_penalty: 3.0
  door_front_half_plane_radius: 1.5
  door_preferred_direction_bonus: 1.5
  # 短期选择惯性：当前区域仍可达时，新目标分数需要至少高出该 margin 才切换。
  switch_score_margin: 3.5
  current_region_radius: 2.0
  # 先以可解释的乐观分数缩小精确 A* 集合，避免 Timer 回调长时间阻塞。
  max_planning_candidates: 8
  max_goal_candidates_per_frontier: 2
  max_fallback_planning_candidates: 8

controller:
  # PathFollower 的路径跟踪与唯一 /cmd_vel 输出上限；最终仍经过 ground_support 门。
  # 两轮独立制动测量封板前冻结在 0.60 m/s，不得提速。
  max_linear: 0.60
  # 0 保持既有全局上限；正数仅限制首次 EXIT_CABIN 通过尝试。
  exit_first_max_linear: 0.0
  # 当前 RL 的横移与转向耦合会抵消 yaw 响应；首版只用 v+omega 跟踪。
  # 保留参数入口，后续若重训/标定横移控制可直接恢复，不改控制器代码。
  max_lateral: 0.01
  max_angular: 1.2
  min_linear_fraction: 0.35
  goal_tolerance: 0.25
  waypoint_tolerance: 0.25
  corner_tolerance: 0.15
  pure_pursuit_lookahead: 0.6
  reverse_speed: -0.15
  recover_duration: 0.5
  recover_turn_duration: 1.0
  recover_angular_speed: 0.55
  # 独立 Timer 重发最近的安全命令，周期必须小于 junior_ctrl 的 0.5 秒超时。
  command_keepalive_period: 0.1
  # A1 机身前缘需要留出停车余量；近于 stop 时只转向，slow 范围内连续减速。
  obstacle_stop_distance: 0.50
  obstacle_slow_distance: 1.00
  progress_distance: 0.25

# 局部地面支撑安全门。正式配置必须开启；只消费未来足迹走廊，不改占据地图。
ground_support:
  production_gate_enabled: true
  # UNKNOWN 临时观察停车可独立关闭；显式低层回波 DROP 仍会锁存停车。
  # 默认保留完整语义，门/电梯闭环回归可用覆盖配置验证 explicit-DROP-only 模式。
  unknown_support_hold_enabled: true
  # 明确 DROP 停稳后仅让当前路径失效，并用现有 BLACK 栅格有界重规划。
  negative_obstacle_replan_enabled: true
  maximum_negative_obstacle_replans: 3
  # 工程保守停车表，尚待两轮独立测量封板；只按请求速度向上取档。
  # 不插值、不向表外外推；扩速前必须新增可追溯实测档位并复验完整前视距离。
  stop_distance_table:
    - [0.60, 0.09337727739487302]
    - [0.651, 0.10195826367975175]
  # 定位差分只承担停稳确认与有界异常观察，不作为物理速度上界或停车表索引。
  # 单帧超过独立故障阈值立即零速；持续 2 秒才按定位损坏显式失败。
  localization_speed_anomaly_threshold: 1.0
  localization_speed_anomaly_timeout: 2.0
  # 正支撑只看左右足迹带；完整物理宽度仍专用于明确 DROP 检测。
  foot_band_center_offset: 0.14
  foot_band_half_width: 0.10
  minimum_foot_band_coverage: 0.60
  # 仅允许被下游正支撑封闭的短内部缺口，末端 UNKNOWN 不桥接。
  maximum_longitudinal_unknown_gap: 0.10
  minimum_longitudinal_support_ratio: 0.75
  sweep_half_width: 0.435393
  minimum_lookahead: 0.50
  # 该前视上限只对当前已验证速度负责；扩速前必须重新验证完整安全包络。
  maximum_lookahead: 0.80
  footprint_front_reach: 0.30
  support_band: 0.08
  minimum_drop: 0.30
  minimum_cell_hits: 2
  required_consecutive_frames: 2
  minimum_alert_cells: 3
  minimum_frame_points: 50
  # 仅稀疏积累局部邻域内的明确楼面回波；负证据和安全消费仍只看未来扫掠区。
  local_support_evidence_radius: 3.0
  # 独立消费最新 cloud，避免 10Hz 任务 tick 固定晚一帧；不改变任务/控制节拍。
  assessment_period: 0.02
  # 由停车余量反推的 DROP 证据硬上限；0.25s 陈旧证据明确无效。
  drop_evidence_max_age: 0.05
  decision_period: 0.10
  rl_receive_delay: 0.009
  required_margin: 0.02
  # 在停车包络外再保留一个机身步幅余量；连续观测到同一边界后才持久化。
  boundary_hold_margin: 0.30
  boundary_persistence_confirmations: 3
  boundary_consistency_radius: 0.20
  release_hysteresis: 0.10
  release_supported_frames: 2
  observation_hold_timeout: 2.0
  safety_stop_timeout: 3.0
  # 与定位发布速度死区构成显式契约，停稳阈值不能比死区更小。
  odometry_linear_deadband: 0.05
  odometry_angular_deadband: 0.03
  stop_linear_threshold: 0.05
  stop_angular_threshold: 0.05
  stop_confirmation_samples: 3
  # UNKNOWN 超时仅清当前 follower 路径，同一父任务 phase 最多重规划两次。
  maximum_same_phase_replans: 2
  base_frame: base
  sensor_frame: laser_livox

detection:
  # 单帧红球外观/三维球拟合门槛；多帧确认与最终去重参数位于 tracker。
  min_area: 35
  min_circularity: 0.55
  min_aspect: 0.65
  max_aspect: 1.55
  min_radius: 0.10
  max_radius: 0.22
  max_rmse: 0.035
  ransac_iterations: 80
  ransac_sample_size: 4
  max_depth: 8.0
  min_depth: 0.35
  # RGB-D 反投影使用 OpenCV 光学坐标：x 右、y 下、z 前。
  # Gazebo 插件 frameName 通常写 robot link 名，因此默认转换到 ROS link 坐标后再走 TF。
  depth_frame_is_optical: true

local_semantic:
  # 仅使用局部点云/RGB-D 注册门和电梯几何；公开 JSON 只提供可调用 ID。
  max_door_distance: 3.0
  door_fov_half_angle: 0.85
  door_evidence_radius: 0.75
  min_door_evidence_points: 6
  min_door_evidence_height: 0.15
  max_door_evidence_height: 1.80
  # 仅以局部点云中两侧竖直回波之间的净空注册门洞，不使用布局坐标。
  opening_min_width: 0.65
  opening_max_width: 2.50
  opening_plane_depth: 0.30
  opening_min_side_height_span: 0.50
  # 多楼层时用合法 RealSense RGB-D 补充发现动态门：深色只负责提出候选，
  # 必须同时通过竖直深度平面、物理尺寸和连续帧约束。
  rgbd_door_detection_enabled: true
  # Livox-only 轿厢注册会把走廊凹槽误认为电梯，正式默认禁用；Livox 仍用于
  # 开门服务后的局部开口确认。
  livox_elevator_registration_enabled: false
  # 实测仿真门板 V 约为 20，周围灰墙大量为 82/90；阈值过大会把整面墙
  # 与门板合并，导致物理宽度校验反而拒绝真实门。
  rgbd_dark_max_value: 50
  rgbd_dark_max_saturation: 85
  rgbd_minimum_pixel_area: 500
  rgbd_minimum_depth: 0.40
  rgbd_maximum_depth: 5.0
  rgbd_minimum_depth_pixels: 250
  rgbd_minimum_panel_width: 0.65
  rgbd_maximum_panel_width: 2.20
  rgbd_minimum_panel_height: 0.80
  rgbd_maximum_plane_rmse: 0.04
  rgbd_maximum_vertical_normal_z: 0.25
  rgbd_minimum_opening_depth_change: 0.30
  rgbd_maximum_opening_dark_ratio: 0.45
  rgbd_minimum_opening_deeper_fraction: 0.20
  # 开门后走廊可能只有稀疏远端深度；仍须同时满足门板消失与更深回波判据。
  rgbd_minimum_opening_valid_depth_fraction: 0.20
  # 视觉只注册候选；TakeElevator 开门后还需 RGB-D 变化或 Livox 开口确认，
  # 确认前不得清除门区地图障碍。
  elevator_visual_confirmations: 3
  # 允许 RGB-D 间歇漏检不超过 0.4s；已有候选时暂停旋转以取得稳定三帧。
  elevator_visual_confirmation_max_gap: 0.4
  # 检测器输出的是单扇滑动门板：实测电梯门由两扇约 0.7 m 门板组成，关门
  # 过程中可见轮廓还受门框遮挡，0.90 的“完整门面”下限会拒绝全部合法
  # 候选。下限与检测器最小门板宽度对齐；更窄的入口门框立柱（实测
  # <=0.45 m）仍由检测器 0.65 下限拒绝，上限继续排除整面深色墙体。
  elevator_visual_min_width: 0.65
  elevator_visual_max_width: 1.80
  elevator_visual_max_distance: 4.0
  elevator_opening_confirmation_timeout: 8.0
  # 呼梯前在当前漂移坐标系内重观测关闭门板；只刷新任务语义几何，不移动地图或 odom。
  elevator_geometry_refresh_timeout: 6.0
  # 机身等待点 0.8m 对前置相机过近；刷新时先停在 1.2m，避免门板被视场裁切。
  elevator_geometry_refresh_standoff: 1.2
  elevator_geometry_refresh_max_shift: 0.75
  elevator_geometry_refresh_max_yaw_change: 0.35
  # 进入主入口并建立足够安全已知区后只执行一次，约覆盖一整圈；发现后立即结束。
  # 命令角速度不等于四足机体的实际 yaw 速度；按定位累计转角闭环，时间仅兜底。
  elevator_visual_scan_duration: 18.0
  elevator_visual_scan_angular_speed: 0.70
  elevator_visual_scan_required_rotation: 5.80
  # 第 14.3 层只读诊断：冻结首次 RGB-D 电梯门板地标并记录跨层残差。
  # 正式默认关闭；结果只允许在任务结束后由独立真值评估，不能改变当轮行为。
  landmark_drift_diagnostic_enabled: false
  landmark_drift_minimum_width: 0.65
  landmark_drift_maximum_width: 1.80
  landmark_drift_maximum_distance: 4.0
  landmark_drift_maximum_yaw_difference: 0.35
  landmark_drift_maximum_width_difference: 0.25
  landmark_drift_required_confirmations: 3
  landmark_drift_maximum_confirmation_gap: 0.4
  landmark_drift_maximum_residual_spread: 0.15
  # 仅用于调试：关闭时必须有局部传感器证据，不能只靠 metadata 近距判断开门。
  use_truth_proximity_detector: false

tracker:
  # DetectionCandidate -> Track -> CONFIRMED -> NMS 输出的时空质量门槛。
  association_radius: 0.45
  confirmation_window: 10.0
  min_hits: 4
  max_position_std: 0.25
  min_confidence: 0.75
  max_average_rmse: 0.04
  nms_radius: 0.9
  stale_after: 30.0

floor:
  # 正式电梯 ID 来自公开 team_scene_info.json；空间几何只能由传感器注册。
  service_timeout: 5.0
